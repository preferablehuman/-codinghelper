  postgres:
    image: postgres:16
    entrypoint: []
    environment:
      - POSTGRES_DB=programming_explainer
      - POSTGRES_USER=explainer
      - POSTGRES_PASSWORD=explainer
      - VERBOSE_LOGGING=${VERBOSE_LOGGING:-false}
      - LOG_DIR=/app/logs
      - LOG_MAX_BYTES=${LOG_MAX_BYTES:-10485760}
      - LOG_MAX_FILES=${LOG_MAX_FILES:-10}
      - POSTGRES_LOG_MIN_MESSAGES=${POSTGRES_LOG_MIN_MESSAGES:-info}
      - POSTGRES_LOG_MIN_DURATION_STATEMENT=${POSTGRES_LOG_MIN_DURATION_STATEMENT:-1000}
      - POSTGRES_LOG_CONNECTIONS=${POSTGRES_LOG_CONNECTIONS:-on}
      - POSTGRES_LOG_DISCONNECTIONS=${POSTGRES_LOG_DISCONNECTIONS:-on}
      - POSTGRES_LOG_STATEMENT=${POSTGRES_LOG_STATEMENT:-none}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./scripts/tee-rotate.sh:/logging/tee-rotate.sh:ro
      - ./logs/postgres:/app/logs
    command: sh -c "if [ \"${VERBOSE_LOGGING:-false}\" = \"true\" ]; then sh /logging/tee-rotate.sh postgres docker-entrypoint.sh postgres -c log_min_messages=debug1 -c log_min_duration_statement=0 -c log_connections=${POSTGRES_LOG_CONNECTIONS:-on} -c log_disconnections=${POSTGRES_LOG_DISCONNECTIONS:-on} -c log_statement=${POSTGRES_LOG_STATEMENT:-none}; else sh /logging/tee-rotate.sh postgres docker-entrypoint.sh postgres -c log_min_messages=${POSTGRES_LOG_MIN_MESSAGES:-info} -c log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION_STATEMENT:-1000} -c log_connections=${POSTGRES_LOG_CONNECTIONS:-on} -c log_disconnections=${POSTGRES_LOG_DISCONNECTIONS:-on} -c log_statement=${POSTGRES_LOG_STATEMENT:-none}; fi"
    logging: *docker-log-options
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U explainer -d programming_explainer"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    entrypoint: []
    ports:
      - "6333:6333"
    environment:
      - VERBOSE_LOGGING=${VERBOSE_LOGGING:-false}
      - QDRANT_LOG_LEVEL=${QDRANT_LOG_LEVEL:-info}
      - LOG_DIR=/app/logs
      - LOG_MAX_BYTES=${LOG_MAX_BYTES:-10485760}
      - LOG_MAX_FILES=${LOG_MAX_FILES:-10}
    volumes:
      - ./data/qdrant:/qdrant/storage
      - ./scripts/tee-rotate.sh:/logging/tee-rotate.sh:ro
      - ./logs/qdrant:/app/logs
    command: sh -c "if [ \"${VERBOSE_LOGGING:-false}\" = \"true\" ]; then export QDRANT__LOG_LEVEL=DEBUG RUST_LOG=debug; else export QDRANT__LOG_LEVEL=${QDRANT_LOG_LEVEL:-info} RUST_LOG=${QDRANT_LOG_LEVEL:-info}; fi; if command -v qdrant >/dev/null 2>&1; then sh /logging/tee-rotate.sh qdrant qdrant; else sh /logging/tee-rotate.sh qdrant ./qdrant; fi"
    logging: *docker-log-options

  sandbox-runner:
    build: ./sandbox-runner
    ports:
      - "8100:8100"
    environment:
      - SANDBOX_TIMEOUT_SECONDS=5
      - SANDBOX_MEMORY_MB=256
      - SANDBOX_WORK_DIR=/sandbox-work
      - VERBOSE_LOGGING=${VERBOSE_LOGGING:-false}
      - LOG_DIR=/app/logs
      - LOG_MAX_BYTES=${LOG_MAX_BYTES:-10485760}
      - LOG_MAX_FILES=${LOG_MAX_FILES:-10}
    volumes:
      - ./sandbox-runner/app:/app/app:ro
      - ./sandbox-runner/tests:/app/tests:ro
      - ./scripts/tee-rotate.sh:/logging/tee-rotate.sh:ro
      - ./scripts/run-sandbox.sh:/logging/run-sandbox.sh:ro
      - ./data/sandbox-runner/work:/sandbox-work
      - ./logs/sandbox-runner:/app/logs
    command: sh /logging/run-sandbox.sh
    logging: *docker-log-options
    read_only: true
    tmpfs:
      - /tmp

  slide-renderer:
    build: ./slide-renderer
    ports:
      - "8200:8200"
    environment:
      - NPM_CONFIG_CACHE=/app/.npm-cache
      - VERBOSE_LOGGING=${VERBOSE_LOGGING:-false}
      - LOG_DIR=/app/logs
      - LOG_MAX_BYTES=${LOG_MAX_BYTES:-10485760}
      - LOG_MAX_FILES=${LOG_MAX_FILES:-10}
    volumes:
      - ./slide-renderer/server.js:/app/server.js:ro
      - ./slide-renderer/test.js:/app/test.js:ro
      - ./slide-renderer/package.json:/app/package.json:ro
      - ./scripts/tee-rotate.sh:/logging/tee-rotate.sh:ro
      - ./data/slide-renderer/node_modules:/app/node_modules
      - ./data/slide-renderer/npm-cache:/app/.npm-cache
      - ./data/slide-renderer/generated-slides:/slides
      - ./logs/slide-renderer:/app/logs
    command: sh -c "sh /logging/tee-rotate.sh slide-renderer npm install --package-lock=false && sh /logging/tee-rotate.sh slide-renderer npm start"
    logging: *docker-log-options
