x-docker-log-options: &docker-log-options
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "10"

services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - NPM_CONFIG_CACHE=/app/.npm-cache
      - VERBOSE_LOGGING=${VERBOSE_LOGGING:-false}
      - LOG_DIR=/app/logs
      - LOG_MAX_BYTES=${LOG_MAX_BYTES:-10485760}
      - LOG_MAX_FILES=${LOG_MAX_FILES:-10}
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/package.json:/app/package.json:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts:ro
      - ./frontend/postcss.config.js:/app/postcss.config.js:ro
      - ./scripts/tee-rotate.sh:/logging/tee-rotate.sh:ro
      - ./data/frontend/node_modules:/app/node_modules
      - ./data/frontend/npm-cache:/app/.npm-cache
      - ./logs/frontend:/app/logs
    command: sh -c "if [ \"${VERBOSE_LOGGING:-false}\" = \"true\" ]; then export DEBUG=vite:*; fi; sh /logging/tee-rotate.sh frontend npm install --package-lock=false && sh /logging/tee-rotate.sh frontend npm run dev -- --host 0.0.0.0"
    logging: *docker-log-options
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HF_HOME=/app/data/model-cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/app/data/model-cache/huggingface
      - TRANSFORMERS_CACHE=/app/data/model-cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/app/data/model-cache/sentence-transformers
      - LOG_DIR=/app/logs
      - LOG_MAX_BYTES=${LOG_MAX_BYTES:-10485760}
      - LOG_MAX_FILES=${LOG_MAX_FILES:-10}
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/tests:/app/tests:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - ./scripts/tee-rotate.sh:/logging/tee-rotate.sh:ro
      - ./scripts/run-backend.sh:/logging/run-backend.sh:ro
      - ./data/backend/artifacts:/app/data/artifacts
      - ./data/backend/model-cache:/app/data/model-cache
      - ./data/backend/source-cache:/app/data/source-cache
      - ./logs/backend:/app/logs
    command: sh /logging/run-backend.sh
    logging: *docker-log-options
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      sandbox-runner:
        condition: service_started
      slide-renderer:
        condition: service_started
      model-gateway:
        condition: service_started

  model-gateway:
    build: ./model-gateway
    expose:
      - "8300"
    env_file:
      - .env
    volumes:
      - ./model-gateway/app:/app/app:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8300 --reload
    logging: *docker-log-options

